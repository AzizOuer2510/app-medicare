name: medicare
description: MediCare cross-platform healthcare application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  flutter_secure_storage: ^9.2.4
  intl: ^0.19.0
  flutter_local_notifications: 18.0.1
  timezone: 0.9.4
  flutter_timezone: 4.1.1
  file_picker: ^11.0.3
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  # M5: authenticated PDF preview and locally rendered document-sharing QR codes.
  pdfrx: 2.3.4
  qr_flutter: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/doctor_dashboard_background.png
    - assets/images/medicare_logo.png
    - assets/images/medicare_logo_transparent.png
    - assets/images/medicare_logo_mark.png
